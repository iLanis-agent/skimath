<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiMath</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0f141b; color: #e8eef5; max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; }
  p.sub { color: #9fb0c3; margin: 0 0 20px; }
  .presets { margin: 0 0 20px; }
  .presets button { background: #1c2530; color: #9fc2e8; border: 1px solid #2d3b4d; border-radius: 999px; padding: 8px 16px; margin: 0 8px 8px 0; cursor: pointer; font-size: .9rem; }
  .presets button:hover { background: #253243; }
  section { background: #16202c; border: 1px solid #243143; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
  label { display: block; font-size: .8rem; color: #9fb0c3; margin-bottom: 4px; }
  input, select { background: #0f141b; border: 1px solid #2d3b4d; color: #e8eef5; border-radius: 8px; padding: 9px 10px; font-size: 1rem; }
  input { width: 100px; }
  .outs { display: flex; flex-wrap: wrap; gap: 14px; }
  .out { background: #101922; border: 1px solid #243143; border-radius: 12px; padding: 14px 18px; min-width: 140px; flex: 1; }
  .out .v { font-size: 1.4rem; font-weight: 700; color: #7fc4ff; }
  .out .k { font-size: .8rem; color: #9fb0c3; margin-top: 4px; }
  .wide { min-width: 260px; }
  .wide .v { font-size: 1.05rem; line-height: 1.45; }
</style>
</head>
<body>
<h1>&#9975; SkiMath</h1>
<p class="sub">Ski setup math - the mountain does not care what the shop guessed.</p>
<div class="presets" id="presets"></div>

<section>
  <h2>1. Release value</h2>
  <div class="row">
    <div><label>Weight (kg)</label><input id="weight" type="number" step="1" value="75"></div>
    <div><label>Skier type</label><select id="type">
      <option value="1">cautious</option>
      <option value="2" selected>moderate</option>
      <option value="3">aggressive</option>
    </select></div>
    <div><label>Age</label><input id="age" type="number" step="1" value="30"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-din">-</div><div class="k">Release estimate</div></div>
    <div class="out wide"><div class="v" id="o-dinnote">-</div><div class="k">Caveat</div></div>
  </div>
</section>

<section>
  <h2>2. Wax</h2>
  <div class="row">
    <div><label>Snow temp (C)</label><input id="snow" type="number" step="1" value="-4"></div>
  </div>
  <div class="outs">
    <div class="out wide"><div class="v" id="o-wax">-</div><div class="k">Wax band</div></div>
  </div>
</section>

<section>
  <h2>3. Edges and length</h2>
  <div class="row">
    <div><label>Level</label><select id="level">
      <option value="recreational" selected>recreational</option>
      <option value="advanced">advanced</option>
      <option value="race">race</option>
    </select></div>
    <div><label>Height (cm)</label><input id="height" type="number" step="1" value="180"></div>
    <div><label>Skill</label><select id="skill">
      <option value="beginner">beginner</option>
      <option value="intermediate" selected>intermediate</option>
      <option value="advanced">advanced</option>
    </select></div>
    <div><label>Style</label><select id="style">
      <option value="piste" selected>piste</option>
      <option value="powder">powder</option>
      <option value="park">park</option>
    </select></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-edge">-</div><div class="k">Edge bevels</div></div>
    <div class="out"><div class="v" id="o-length">-</div><div class="k">Ski length</div></div>
    <div class="out wide"><div class="v" id="o-edgenote">-</div><div class="k">Edge note</div></div>
  </div>
</section>

<script>
// SkiMath engine - ski setup math. Pure functions, no DOM.
(function (root) {
  'use strict';

  // Release-value estimate from weight band + skier type (1 cautious, 2 moderate, 3 aggressive).
  // Simplified from the published chart's mid band; always confirm with a shop test.
  function dinEstimate(weightKg, type) {
    if (weightKg <= 0) throw new Error('weight must be positive');
    if (type < 1 || type > 3) throw new Error('type is 1, 2, or 3');
    var base;
    if (weightKg < 22) base = 0.75;
    else if (weightKg < 30) base = 1.5;
    else if (weightKg < 39) base = 2.25;
    else if (weightKg < 48) base = 3;
    else if (weightKg < 57) base = 3.75;
    else if (weightKg < 67) base = 4.5;
    else if (weightKg < 78) base = 5.5;
    else if (weightKg < 94) base = 6.5;
    else if (weightKg < 110) base = 7.5;
    else base = 8.5;
    var v = base + (type - 2) * 0.75;
    return Math.max(0.75, Math.round(v * 4) / 4);
  }

  function dinNote(weightKg, age) {
    if (age >= 50) return 'over 50: the chart steps one band down - older legs prefer earlier release';
    if (weightKg < 22) return 'child band - a shop test is mandatory, not optional';
    return 'estimate from the mid chart band - a shop torque test is the authority';
  }

  // Kick/glide wax band by snow temperature (C). Classic grip-wax style bands.
  function waxBand(snowC) {
    if (snowC < -20) return 'extra green (special cold) - scrape and brush hard';
    if (snowC < -10) return 'green (CH4 / VR20) - the cold-snow workhorse';
    if (snowC < -6) return 'blue (CH6 / VR30)';
    if (snowC < -2) return 'violet (VR45) - the transition band';
    if (snowC <= 0) return 'red (CH8 / VR55) - near-zero magic';
    if (snowC <= 3) return 'yellow / universal (CH10) - wet new snow';
    return 'klister territory - cover the grip zone, no wax will hold';
  }

  // Edge bevel guide by level. Returns {base, side, note}.
  function edgeGuide(level) {
    if (level === 'race') return { base: 0.5, side: 87, note: '0.5 base / 87 side - bites hard, punishes lazy skiing' };
    if (level === 'advanced') return { base: 0.75, side: 88, note: '0.75 base / 88 side - grip without the twitch' };
    return { base: 1, side: 89, note: '1 base / 89 side - forgiving and durable, the sensible default' };
  }

  // Ski length recommendation (cm) from height, skill, and style.
  function skiLength(heightCm, skill, style) {
    if (heightCm <= 0) throw new Error('height must be positive');
    var adj;
    if (skill === 'beginner') adj = -12;
    else if (skill === 'intermediate') adj = -6;
    else adj = -2;
    if (style === 'powder') adj += 8;
    else if (style === 'park') adj -= 4;
    return heightCm + adj;
  }

  var api = {
    dinEstimate: dinEstimate,
    dinNote: dinNote,
    waxBand: waxBand,
    edgeGuide: edgeGuide,
    skiLength: skiLength
  };
  root.SkiMath = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  var E = window.SkiMath;
  function num(id) { return parseFloat(document.getElementById(id).value) || 0; }
  function txt(id) { return document.getElementById(id).value; }
  function set(id, v) { document.getElementById(id).textContent = v; }

  function compute() {
    var w = num('weight'), type = parseInt(txt('type'), 10), age = num('age');
    if (w > 0) {
      set('o-din', String(E.dinEstimate(w, type)));
      set('o-dinnote', E.dinNote(w, age));
    }
    set('o-wax', E.waxBand(num('snow')));
    var eg = E.edgeGuide(txt('level'));
    set('o-edge', eg.base + ' / ' + eg.side);
    set('o-edgenote', eg.note);
    var h = num('height');
    if (h > 0) set('o-length', E.skiLength(h, txt('skill'), txt('style')) + ' cm');
  }

  var presets = [
    { name: 'Weekend cruiser', v: { weight: 75, type: '2', age: 30, snow: -4, level: 'recreational', height: 180, skill: 'intermediate', style: 'piste' } },
    { name: 'Racer kid', v: { weight: 55, type: '3', age: 16, snow: -12, level: 'race', height: 168, skill: 'advanced', style: 'piste' } },
    { name: 'Powder trip', v: { weight: 85, type: '2', age: 35, snow: -8, level: 'advanced', height: 182, skill: 'advanced', style: 'powder' } },
    { name: 'First timer', v: { weight: 65, type: '1', age: 52, snow: 1, level: 'recreational', height: 170, skill: 'beginner', style: 'piste' } }
  ];
  var holder = document.getElementById('presets');
  presets.forEach(function (p) {
    var b = document.createElement('button');
    b.textContent = p.name;
    b.addEventListener('click', function () {
      Object.keys(p.v).forEach(function (k) {
        var el = document.getElementById(k);
        if (el) el.value = p.v[k];
      });
      compute();
    });
    holder.appendChild(b);
  });

  ['weight', 'type', 'age', 'snow', 'level', 'height', 'skill', 'style'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('input', compute);
    el.addEventListener('change', compute);
  });
  compute();
})();
</script>
</body>
</html>
